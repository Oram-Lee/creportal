<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로드뷰 · CRE Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--navy:#2b323d;--pink:#ec4899;--line:#e3e6ea;--muted:#7c848f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
       color:var(--navy);display:flex;flex-direction:column;background:#0f1216}
  header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;
         align-items:center;gap:12px;flex-wrap:wrap;flex:0 0 auto}
  header .nm{font-size:15px;font-weight:700;letter-spacing:-.2px}
  header .ad{font-size:12px;color:#aab2bd}
  .sp{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  button,.lnk{font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;
       border-radius:6px;border:1px solid rgba(255,255,255,.22);
       background:rgba(255,255,255,.12);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  button:hover,.lnk:hover{background:rgba(255,255,255,.22)}
  button.go{background:var(--pink);border-color:var(--pink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  #rv{flex:1;min-height:0;width:100%;background:#0f1216}
  .msg{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;
       gap:8px;color:#aab2bd;font-size:14px;text-align:center;padding:24px}
  .msg b{color:#fff;font-size:16px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
         background:var(--navy);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;
         box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}
  .hint{position:absolute;left:14px;bottom:14px;background:rgba(15,18,22,.78);color:#d7dce3;
        font-size:11.5px;padding:6px 11px;border-radius:6px;line-height:1.5;max-width:300px}
  .wrap{flex:1;position:relative;min-height:0;display:flex}
</style>
</head>
<body>
<header>
  <div>
    <div class="nm" id="bName">로드뷰</div>
    <div class="ad" id="bAddr">불러오는 중…</div>
  </div>
  <div class="sp">
    <button id="btnReset" title="빌딩 중심을 향하도록 다시 맞춥니다">↺ 자동 조준</button>
    <button id="btnSave" class="go" title="지금 보이는 화면을 이 빌딩의 기본 시점으로 저장합니다">이 시점 저장</button>
    <button id="btnClear" title="저장된 시점을 지우고 자동 조준으로 되돌립니다">저장 해제</button>
    <a class="lnk" id="btnKakao" target="_blank" rel="noopener">카카오맵</a>
  </div>
</header>

<div class="wrap">
  <div id="rv"></div>
  <div class="hint" id="hint" hidden></div>
</div>
<div class="msg" id="msg" hidden><b>로드뷰를 불러올 수 없습니다</b><span id="msgSub"></span></div>
<div class="toast" id="toast"></div>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1ac6eee9b1e4c2e0cc6f1d1ca1a6a559&autoload=false"></script>
<script>
const DB = 'https://cre-unified-default-rtdb.asia-southeast1.firebasedatabase.app';

/* ── URL 파라미터 ────────────────────────────────────────── */
const qs = new URLSearchParams(location.search);
const P = {
  id:   qs.get('id') || '',
  lat:  parseFloat(qs.get('lat')),
  lng:  parseFloat(qs.get('lng')),
  name: qs.get('name') || '',
  addr: qs.get('addr') || ''
};

/* 파노라마 탐색 반경 — 좁은 곳부터 넓혀 가며 시도한다.
   가까운 파노라마일수록 그 건물이 면한 도로일 확률이 높다. */
const RADII = [30, 60, 120, 250];

let rv = null, rvClient = null, target = null, saved = null, bid = P.id;

const $ = s => document.querySelector(s);
const toast = (t, ms = 1800) => {
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), ms);
};
const fail = (sub) => { $('#rv').hidden = true; $('.wrap').hidden = true;
  $('#msg').hidden = false; $('#msgSub').textContent = sub; };

/* ── 빌딩 정보 로드 ──────────────────────────────────────── */
async function loadBuilding() {
  let b = null;
  if (bid) {
    try {
      const r = await fetch(`${DB}/buildings/${encodeURIComponent(bid)}.json`, { cache: 'no-store' });
      if (r.ok) b = await r.json();
    } catch (e) { console.warn('빌딩 조회 실패', e); }
  }
  const lat = (b && (b.lat ?? b.coordinates?.lat)) ?? P.lat;
  const lng = (b && (b.lng ?? b.coordinates?.lng)) ?? P.lng;
  const name = (b && b.name) || P.name || '(이름 없음)';
  const addr = (b && (b.address || b.addressJibun)) || P.addr || '';
  saved = (b && b.roadview) || null;

  $('#bName').textContent = name;
  $('#bAddr').textContent = addr || '주소 없음';
  document.title = `${name} · 로드뷰`;

  if (!(lat && lng)) {
    $('#btnKakao').href = `https://map.kakao.com/link/search/${encodeURIComponent(addr || name)}`;
    fail('이 빌딩에는 좌표가 없습니다. 상단 [카카오맵]으로 주소 검색을 이용하세요.');
    return null;
  }
  $('#btnKakao').href = `https://map.kakao.com/link/roadview/${lat},${lng}`;
  return { lat, lng, name, addr };
}

/* ── 로드뷰 초기화 ──────────────────────────────────────── */
function findPano(pos, i = 0) {
  if (i >= RADII.length) { fail('주변에 로드뷰 촬영 지점이 없습니다.'); return; }
  rvClient.getNearestPanoId(pos, RADII[i], panoId => {
    if (panoId === null) return findPano(pos, i + 1);
    // ★ 두 번째 인자에 건물 좌표를 주면 카메라가 그 지점을 바라보도록 초기화된다.
    //   (좌표만 넘기면 촬영 차량의 진행 방향으로 열려 측면·후면이 나온다)
    rv.setPanoId(panoId, pos);
  });
}

function applySaved() {
  if (!saved || saved.panoId == null) return false;
  rv.setPanoId(saved.panoId, target);
  // setPanoId 후 init 이벤트에서 저장된 각도를 덮어쓴다
  kakao.maps.event.addListener(rv, 'init', function once() {
    kakao.maps.event.removeListener(rv, 'init', once);
    rv.setViewpoint({ pan: saved.pan ?? 0, tilt: saved.tilt ?? 0, zoom: saved.zoom ?? 0 });
  });
  return true;
}

function autoAim() {
  if (!target) return;
  findPano(new kakao.maps.LatLng(target.lat, target.lng));
  showHint('건물 중심을 향해 자동 조준했습니다. 각도를 맞춘 뒤 [이 시점 저장]을 누르면 다음부터 그 화면으로 열립니다.');
}

function showHint(t) { const h = $('#hint'); h.textContent = t; h.hidden = false;
  clearTimeout(showHint._t); showHint._t = setTimeout(() => h.hidden = true, 6000); }

/* ── 시점 저장 / 해제 ───────────────────────────────────── */
async function saveViewpoint() {
  if (!bid) { toast('빌딩 ID가 없어 저장할 수 없습니다'); return; }
  if (!rv) return;
  const vp = rv.getViewpoint();
  const body = { panoId: rv.getPanoId(), pan: vp.pan, tilt: vp.tilt, zoom: vp.zoom,
                 savedAt: new Date().toISOString() };
  $('#btnSave').disabled = true;
  try {
    const r = await fetch(`${DB}/buildings/${encodeURIComponent(bid)}/roadview.json`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    saved = body; toast('이 시점을 기본값으로 저장했습니다');
  } catch (e) { toast('저장 실패: ' + e.message, 2600); }
  $('#btnSave').disabled = false;
}

async function clearViewpoint() {
  if (!bid || !saved) { toast('저장된 시점이 없습니다'); return; }
  if (!confirm('저장된 시점을 지우고 자동 조준으로 되돌립니다.')) return;
  try {
    const r = await fetch(`${DB}/buildings/${encodeURIComponent(bid)}/roadview.json`, { method: 'DELETE' });
    if (!r.ok) throw new Error(r.status);
    saved = null; toast('저장된 시점을 해제했습니다'); autoAim();
  } catch (e) { toast('해제 실패: ' + e.message, 2600); }
}

/* ── 시작 ───────────────────────────────────────────────── */
(async () => {
  target = await loadBuilding();
  if (!target) return;
  if (typeof kakao === 'undefined') { fail('카카오맵 SDK를 불러오지 못했습니다.'); return; }

  kakao.maps.load(() => {
    rv = new kakao.maps.Roadview($('#rv'));
    rvClient = new kakao.maps.RoadviewClient();

    if (!applySaved()) autoAim();

    $('#btnReset').onclick = autoAim;
    $('#btnSave').onclick  = saveViewpoint;
    $('#btnClear').onclick = clearViewpoint;
    window.addEventListener('resize', () => rv && rv.relayout());
  });
})();
</script>
</body>
</html>
