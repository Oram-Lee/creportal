<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CRE Portal 주소 이전</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sni-corp.github.io/creportal/portal.html">
<script>
  // 같은 파일명·쿼리·해시를 유지한 채 법인 주소로 이동. index.html(또는 폴더 루트)은 portal.html로 보냄
  (function () {
    var base = 'https://sni-corp.github.io/creportal/';
    var file = location.pathname.replace(/^\/creportal\/?/i, '');
    if (!file || file === 'index.html') file = 'portal.html';
    location.replace(base + file + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://sni-corp.github.io/creportal/portal.html">
</head>
<body>
<p>CRE Portal 주소가 변경되었습니다. 자동으로 이동하지 않으면
<a href="https://sni-corp.github.io/creportal/portal.html">새 주소로 이동</a>하세요.</p>
</body>
</html>
